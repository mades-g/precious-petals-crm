<html>

    <title>{{block "title" .}}Email{{end}}</title>

        line-height: 1.5;
        color: #111;
        background: #fff;
      }
      .container {
        max-width: 680px;
        margin: 0 auto;
        padding: 24px;

      {{block "body" .}}{{end}}

          style="
            display: block;
            border: 0;
            outline: none;
            text-decoration: none;
            width: 100%;
            max-width: 320px;
            height: auto;
          "
        />
      </div>
    </div>
