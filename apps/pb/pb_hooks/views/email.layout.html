<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{block "title" .}}Email{{end}}</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
        color: #111;
        background: #fff;
      }
      .container {
        max-width: 680px;
        margin: 0 auto;
        padding: 24px;
      }
      a {
        color: inherit;
      }
      .cta-button {
        display: inline-block;
        padding: 12px 18px;
        border: 3px solid #111;
        background: #ddb8b8;
        color: #111 !important;
        text-decoration: none;
        font-weight: 700;
      }
      .cta-button:hover {
        background: #c9d7ad;
      }
    </style>
  </head>
  <body>
    <div class="container">
      {{if .logoDataURI}}
      <div style="margin-bottom: 24px">
        <img
          src="{{safeURL .logoDataURI}}"
          alt="Precious Petals"
          style="
            display: block;
            border: 0;
            outline: none;
            text-decoration: none;
            width: 100%;
            max-width: 458px;
            height: auto;
          "
        />
      </div>
      {{end}}
      {{block "body" .}}{{end}}
    </div>
  </body>
</html>
